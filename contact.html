<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/contact.js" type="module"></script>
    <title>Contact Me</title>
</head>
<body>
    <header id="main-header"></header>
    
    <main>
        <h2>Got Questions? Comments?</h2>

        <form class="contact-form">
            <fieldset>
                <legend>About You</legend>
                <label><input type="text" name="uname" required></label>
                <label><input type="email" name="emai" required></label>
            </fieldset>

            <fieldset>
                <legend>Message</legend>
                <textarea name="umessage" required></textarea>
            </fieldset>

            <button type="submit" class="normal-button">Contact me</button>
        </form>
    </main>
    
    <footer id="main-footer"></footer>
</body>
</html>
